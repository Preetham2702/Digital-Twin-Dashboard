events {}

http {
  server {
    listen 80;

    # FRONTEND
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri /index.html;
    }

    # BACKEND API
    location /api/ {
      proxy_pass http://backend:8000/;
    }

    # WEBSOCKETS (MOONRAKER + YOUR WS)
    location /ws/ {
      proxy_pass http://backend:8000/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # VIDEO STREAM
    location /video_feed {
      proxy_pass http://backend:8000/video_feed;
    }
  }
}